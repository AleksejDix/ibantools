name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported versions from package.json engines, plus the current LTS line.
        node-version: ['20.19', '22.12', '22.x']
    steps:
      - uses: actions/checkout@v4
      - name: Check lockfile uses the public npm registry
        run: |
          if grep -n '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "::error::package-lock.json contains packages resolved from a registry other than registry.npmjs.org"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run docs:lint
      - run: npm run docs
      - run: npm run build
